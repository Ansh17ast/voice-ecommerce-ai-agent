name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run verification test suite
        env:
          CI: "true"
          GREEN_API_HOST: https://api.green-api.com
          GREEN_API_ID_INSTANCE: "mock_instance"
          GREEN_API_TOKEN: "mock_token"
          TRIAL_MODE: "true"
          TEST_WHATSAPP_NUMBER: "15551234567"
          DEV_RECIPIENT_CHAT_ID: "15551234567@c.us"
          DEFAULT_CUSTOMER_PHONE: "+15551234567"
          MY_CONTACT_NAME: "Alex"
          MY_CONTACT_PHONE: "+1-555-123-4567"
        run: |
          pytest -v
